<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>DFM · 管理员面板</title>
<style>
  :root{
    --bg:#080c11; --bg2:#0d131a; --card:#111a23; --card2:#0f1720;
    --line:#1d2836; --line2:#243244;
    --fg:#e8eef5; --dim:#8296ab; --dim2:#5d7086;
    --accent:#2fd2a8; --accent2:#1fa88a;
    --ally:#5fe3c0; --enemy:#ff5f6d; --gold:#ffc84a; --bot:#8fa3b8;
    --r:14px; --r2:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#0a1017 0%,#080c11 240px);
    color:var(--fg); min-height:100vh;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  /* ---------- 顶栏 ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(10,16,23,.92); backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
  h1 i{font-style:normal;color:var(--accent)}
  .spacer{flex:1}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line2); background:#131d27; color:var(--fg);
    border-radius:var(--r2); padding:7px 12px; font-size:13px; cursor:pointer;
    transition:.15s; font-weight:500;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#06231d;font-weight:700}
  .btn.ghost{background:transparent;color:var(--dim)}
  .btn:disabled{opacity:.45}
  .btn .ic{font-size:14px;line-height:1}
  .searchwrap{position:relative;flex:1 1 190px;min-width:150px}
  .searchwrap input{
    width:100%; padding:8px 11px 8px 32px; font-size:14px;
    background:#0c141c; border:1px solid var(--line2); border-radius:var(--r2);
    color:var(--fg); outline:none;
  }
  .searchwrap input:focus{border-color:var(--accent2)}
  .searchwrap::before{
    content:"🔍"; position:absolute; left:10px; top:50%; transform:translateY(-50%);
    font-size:12px; opacity:.6; pointer-events:none;
  }
  /* ---------- 统计 ---------- */
  .stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(78px,1fr)); gap:8px;
    padding:10px 14px 0;
  }
  .st{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r2);
    padding:8px 10px;
  }
  .st b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
  .st span{font-size:11px;color:var(--dim)}
  .st.ally b{color:var(--ally)} .st.enemy b{color:var(--enemy)}
  .st.val b{color:var(--gold)}
  /* ---------- 过滤条 ---------- */
  .filters{
    display:flex;gap:8px;overflow-x:auto;padding:10px 14px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:none; border:1px solid var(--line2); background:#101a23; color:var(--dim);
    border-radius:999px; padding:6px 13px; font-size:12.5px; cursor:pointer; white-space:nowrap;
    transition:.15s;
  }
  .chip.on{background:var(--accent);border-color:transparent;color:#06231d;font-weight:700}
  .srcbar{
    display:flex;align-items:center;gap:8px;padding:0 14px 10px;font-size:11.5px;color:var(--dim2);
    flex-wrap:wrap;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;
       box-shadow:0 0 8px var(--accent)}
  .dot.off{background:var(--dim2);box-shadow:none}
  /* ---------- 卡片列表 ---------- */
  .list{padding:4px 14px 40px;display:grid;gap:10px}
  @media(min-width:900px){ .list{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))} }
  .room{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:11px 12px; cursor:pointer; transition:.15s; position:relative; overflow:hidden;
  }
  .room:active{transform:scale(.985)}
  .room.hot{border-color:rgba(255,200,74,.42)}
  .room.hot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
  .room.idle{opacity:.72}
  .r1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .rno{font-size:18px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .node{font-size:11px;color:var(--dim2);border:1px solid var(--line2);border-radius:5px;padding:0 5px}
  .map{font-size:13px;color:var(--dim)}
  .val{margin-left:auto;font-size:16px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .val.zero{color:var(--dim2);font-weight:600;font-size:14px}
  .r2{display:flex;gap:12px;margin-top:7px;font-size:12.5px;color:var(--dim);flex-wrap:wrap}
  .r2 u{text-decoration:none;font-weight:700;font-variant-numeric:tabular-nums}
  .r2 .a u{color:var(--ally)} .r2 .e u{color:var(--enemy)} .r2 .b u{color:var(--bot)}
  .names{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .nm{
    font-size:11.5px;padding:2px 7px;border-radius:6px;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .nm.a{color:var(--ally);background:rgba(95,227,192,.10);border:1px solid rgba(95,227,192,.28)}
  .nm.e{color:var(--enemy);background:rgba(255,95,109,.10);border:1px solid rgba(255,95,109,.26)}
  .badge{font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--dim2)}
  .badge.not{border-color:rgba(255,200,74,.4);color:var(--gold)}
  /* ---------- 表格视图 ---------- */
  .tablewrap{display:none;padding:0 14px 40px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:#0c1319;color:var(--dim);font-weight:500;font-size:11.5px;z-index:2}
  th.sortable{cursor:pointer}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#131d27}
  tbody tr{cursor:pointer}
  body.tableview .list{display:none}
  body.tableview .tablewrap{display:block}
  /* ---------- 其他 ---------- */
  .empty{padding:56px 20px;text-align:center;color:var(--dim2)}
  .empty .big{font-size:30px;margin-bottom:10px;opacity:.5}
  .skeleton{height:76px;border-radius:var(--r);background:linear-gradient(90deg,#111a23 25%,#16222e 50%,#111a23 75%);
            background-size:200% 100%;animation:sk 1.3s infinite}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:#06231d;font-weight:700;font-size:13.5px;
    padding:9px 18px;border-radius:999px;opacity:0;transition:.22s;z-index:60;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .warnbox{margin:0 14px 10px;padding:10px 13px;border-radius:var(--r2);
           background:rgba(255,200,74,.09);border:1px solid rgba(255,200,74,.3);
           color:var(--gold);font-size:12.5px}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>DFM <i>· 管理面板</i></h1>
    <div class="spacer"></div>
    <button class="btn ghost" id="viewBtn" title="切换视图"><span class="ic">▤</span><span id="viewTxt">表格</span></button>
    <button class="btn primary" id="reload"><span class="ic">⟳</span>刷新</button>
  </div>
  <div class="top" style="margin-top:9px">
    <div class="searchwrap"><input id="q" placeholder="搜房间号 / 玩家名 / 地图" autocomplete="off"></div>
    <label class="btn ghost" style="gap:6px"><input type="checkbox" id="auto" checked style="accent-color:var(--accent)"> 自动</label>
  </div>
</header>

<div class="stats">
  <div class="st"><b id="cActive">–</b><span>有数据</span></div>
  <div class="st"><b id="cNot">–</b><span>未进入</span></div>
  <div class="st ally"><b id="cAlly">–</b><span>我方玩家</span></div>
  <div class="st enemy"><b id="cEnemy">–</b><span>敌方玩家</span></div>
  <div class="st val"><b id="cTotal">–</b><span>总价值</span></div>
  <div class="st"><b id="cClosed">–</b><span>已关闭</span></div>
</div>

<div class="filters">
  <button class="chip on" data-f="all">全部</button>
  <button class="chip" data-f="players">有玩家</button>
  <button class="chip" data-f="ally">我方≥1</button>
  <button class="chip" data-f="enemy">有敌方</button>
  <button class="chip" data-f="rich">价值≥50万</button>
  <button class="chip" data-f="notentered">未进入</button>
</div>

<div class="srcbar">
  <i class="dot" id="srcDot"></i>
  <span id="src">加载中…</span>
  <span id="cost"></span>
</div>

<div id="notice"></div>
<div class="list" id="list">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</div>

<div class="tablewrap">
  <table>
    <thead><tr>
      <th class="sortable" data-k="room">房间</th>
      <th class="sortable" data-k="node">节点</th>
      <th class="sortable" data-k="map">地图</th>
      <th class="sortable num" data-k="peers">在线</th>
      <th class="sortable num" data-k="na">我方</th>
      <th class="sortable num" data-k="ne">敌方</th>
      <th class="sortable num" data-k="nb">人机</th>
      <th>我方玩家</th>
      <th>敌方玩家</th>
      <th class="sortable num" data-k="items">带价</th>
      <th class="sortable num" data-k="total">总价值</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div class="toast" id="toast">已复制</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function wan(v){
    v=v||0;
    if(v>=10000) return (v/10000).toFixed(v>=1000000?0:1).replace(/\.0$/,"")+"万";
    return v.toLocaleString("en-US");
  }
  function full(v){ return (v||0).toLocaleString("en-US"); }

  var rows=[], counts={}, filter="all", sortKey="total", sortAsc=false, timer=null, ok=false;

  function load(){
    fetch("./rooms.json?_="+Date.now(),{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(d){
        rows=(d.active||[]).concat(d.notentered||[]);
        counts=d.counts||{};
        ok=true;
        $("srcDot").className="dot";
        $("src").textContent="服务端扫描 · "+(d.generated_at||"");
        $("cost").textContent=d.cost_seconds?("· 耗时 "+d.cost_seconds+"s"):"";
        $("notice").innerHTML="";
        paint(); render();
      })
      .catch(function(e){
        ok=false;
        $("srcDot").className="dot off";
        $("src").textContent="读不到 rooms.json（"+e.message+"）";
        $("notice").innerHTML='<div class="warnbox">服务端扫描暂时不可用。'+
          '确认服务器上的 <b>radar-scan</b> 服务在运行，或稍后重试。</div>';
        if(!rows.length) $("list").innerHTML='<div class="empty"><div class="big">🛰️</div>暂无数据</div>';
      });
  }

  function paint(){
    var peers=0,ally=0,enemy=0,total=0;
    rows.forEach(function(r){
      if(r.status==="active"){ peers+=r.peers||0; ally+=r.na||0; enemy+=r.ne||0; total+=r.total||0; }
    });
    $("cActive").textContent=counts.active||0;
    $("cNot").textContent=counts.notentered||0;
    $("cAlly").textContent=ally;
    $("cEnemy").textContent=enemy;
    $("cTotal").textContent=wan(total);
    $("cClosed").textContent=counts.closed||0;
  }

  function visible(){
    var q=($("q").value||"").trim().toLowerCase();
    return rows.filter(function(r){
      if(filter==="players" && !((r.na||0)+(r.ne||0))) return false;
      if(filter==="ally" && !(r.na>0)) return false;
      if(filter==="enemy" && !(r.ne>0)) return false;
      if(filter==="rich" && !((r.total||0)>=500000)) return false;
      if(filter==="notentered" && r.status!=="notentered") return false;
      if(!q) return true;
      if(String(r.room).indexOf(q)>=0) return true;
      if((r.map||"").toLowerCase().indexOf(q)>=0) return true;
      return (r.an||[]).concat(r.en||[]).some(function(n){
        return String(n).toLowerCase().indexOf(q)>=0; });
    }).sort(function(a,b){
      var x=a[sortKey], y=b[sortKey];
      if(sortKey==="room"){ x=+x; y=+y; }
      if(typeof x==="string"){ return sortAsc?(x>y?1:-1):(x<y?1:-1); }
      return sortAsc?((x||0)-(y||0)):((y||0)-(x||0));
    });
  }

  function render(){
    var list=visible();
    /* 卡片 */
    var L=$("list");
    if(!list.length){
      L.innerHTML='<div class="empty"><div class="big">🔎</div>没有匹配的房间</div>';
    } else {
      L.innerHTML=list.slice(0,500).map(function(r){
        var not=r.status==="notentered";
        var hot=(r.total||0)>=500000;
        var names="";
        (r.an||[]).slice(0,8).forEach(function(n){ names+='<span class="nm a">'+esc(n)+'</span>'; });
        (r.en||[]).slice(0,8).forEach(function(n){ names+='<span class="nm e">'+esc(n)+'</span>'; });
        return '<div class="room'+(hot?" hot":"")+(not?" idle":"")+'" data-room="'+r.room+'">'+
          '<div class="r1">'+
            '<span class="rno">'+r.room+'</span>'+
            '<span class="node">'+r.node+'号</span>'+
            '<span class="map">'+(not?'<span class="badge not">未进入</span>':esc(r.map||"?"))+'</span>'+
            '<span class="val'+(r.total?"":" zero")+'">'+wan(r.total)+'</span>'+
          '</div>'+
          '<div class="r2">'+
            '<span>在线 <u>'+(r.peers||0)+'</u></span>'+
            '<span class="a">我方 <u>'+(r.na||0)+'</u></span>'+
            '<span class="e">敌方 <u>'+(r.ne||0)+'</u></span>'+
            '<span class="b">人机 <u>'+(r.nb||0)+'</u></span>'+
            '<span>带价 <u>'+(r.items||0)+'</u></span>'+
          '</div>'+
          (names?'<div class="names">'+names+'</div>':'')+
        '</div>';
      }).join("");
    }
    /* 表格 */
    var tb=$("rows");
    tb.innerHTML=list.slice(0,600).map(function(r){
      var not=r.status==="notentered";
      var an=(r.an||[]).map(function(n){return '<span class="nm a">'+esc(n)+'</span>';}).join(" ");
      var en=(r.en||[]).map(function(n){return '<span class="nm e">'+esc(n)+'</span>';}).join(" ");
      return '<tr data-room="'+r.room+'">'+
        '<td><b>'+r.room+'</b></td><td>'+r.node+'</td>'+
        '<td>'+(not?"未进入":esc(r.map||"?"))+'</td>'+
        '<td class="num">'+(r.peers||0)+'</td>'+
        '<td class="num" style="color:var(--ally)">'+(r.na||0)+'</td>'+
        '<td class="num" style="color:var(--enemy)">'+(r.ne||0)+'</td>'+
        '<td class="num">'+(r.nb||0)+'</td>'+
        '<td>'+an+'</td><td>'+en+'</td>'+
        '<td class="num">'+(r.items||0)+'</td>'+
        '<td class="num" style="color:var(--gold)"><b>'+full(r.total)+'</b></td></tr>';
    }).join("");
  }

  function toast(msg){
    var t=$("toast"); t.textContent=msg||"已复制房间号"; t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1100);
  }

  /* 事件 */
  $("reload").addEventListener("click", function(){ load(); toast("已刷新"); });
  $("q").addEventListener("input", render);
  $("viewBtn").addEventListener("click", function(){
    document.body.classList.toggle("tableview");
    var t=document.body.classList.contains("tableview");
    $("viewTxt").textContent = t ? "卡片" : "表格";
    render();
  });
  document.querySelectorAll(".chip").forEach(function(c){
    c.addEventListener("click", function(){
      document.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on");});
      c.classList.add("on");
      filter=c.getAttribute("data-f");
      render();
    });
  });
  document.querySelectorAll("th.sortable").forEach(function(th){
    th.addEventListener("click", function(){
      var k=th.getAttribute("data-k");
      if(sortKey===k) sortAsc=!sortAsc; else { sortKey=k; sortAsc=false; }
      render();
    });
  });
  function copyRoom(el){
    var room=el.getAttribute("data-room");
    try{ navigator.clipboard.writeText(room); }catch(_){
      try{ var ta=document.createElement("textarea"); ta.value=room;
        document.body.appendChild(ta); ta.select(); document.execCommand("copy");
        document.body.removeChild(ta); }catch(__){}
    }
    toast("房间号 "+room+" 已复制");
  }
  $("list").addEventListener("click", function(e){
    var el=e.target.closest(".room"); if(el) copyRoom(el);
  });
  $("rows").addEventListener("click", function(e){
    var el=e.target.closest("tr[data-room]"); if(el) copyRoom(el);
  });

  function tick(){
    if($("auto").checked) load();
    timer=setTimeout(tick, 20000);
  }
  load();
  timer=setTimeout(tick, 20000);
})();
</script>
</body>
</html>
